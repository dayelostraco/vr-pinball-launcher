name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Portable production line and branch coverage
        shell: powershell
        run: |
          dotnet restore tests/dotnet/Tests/Tests.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/dotnet/Tests/Tests.csproj --no-restore /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=../../../Logs/portable-coverage.xml /p:Threshold=80 /p:ThresholdType=line%2cbranch
          exit $LASTEXITCODE
      - name: Per-file production coverage baseline
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check-coverage.py Logs/portable-coverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: portable-coverage
          path: Logs/portable-coverage.xml
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Source and PowerShell coverage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/check-source.ps1
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force
          ./tools/test-powershell.ps1
      - name: Controller bridge syntax and input decisions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/TrustedDownloads.ps1
          $installer = Get-TrustedDownload 'autohotkey'
          $portable = Join-Path $env:RUNNER_TEMP 'ahk-validation'
          & 7z x $installer "-o$portable" -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/test-controller-bridge.ps1 -AutoHotkeyExe (Join-Path $portable 'AutoHotkeyU64.exe')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: powershell-coverage
          path: |
            Logs/powershell-coverage.xml
            Logs/powershell-tests.xml
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m coverage run -m pytest tools/tests -q -p no:cacheprovider
      - run: python -m coverage json
      - run: python tools/check-coverage.py
      - run: python tools/check-docs.py
      - run: python tools/check-native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-coverage
          path: Logs/python-coverage.json
