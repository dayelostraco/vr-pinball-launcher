name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 8 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.182.1 pip-audit==2.10.1
      - name: Static analysis and secrets
        run: |
          mkdir -p Logs
          semgrep scan --config p/csharp --config p/python --config p/github-actions --config p/secrets --metrics off --error --json-output Logs/semgrep.json .
      - name: Python dependency advisories
        run: pip-audit -r requirements-dev.txt -f json -o Logs/pip-audit.json
      - name: Install verified Trivy
        run: |
          curl --fail --location --output /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          echo 'c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  /tmp/trivy.tar.gz' | sha256sum --check
          mkdir -p /tmp/vrl-trivy
          tar -xzf /tmp/trivy.tar.gz -C /tmp/vrl-trivy trivy
      - name: Dependency and secret scan
        run: |
          mkdir -p Logs/security-input
          cp requirements-dev.txt Logs/security-input/requirements.txt
          /tmp/vrl-trivy/trivy fs --scanners vuln,secret,misconfig --skip-dirs .git --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --format json --output Logs/trivy.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports
          path: |
            Logs/semgrep.json
            Logs/pip-audit.json
            Logs/trivy.json
