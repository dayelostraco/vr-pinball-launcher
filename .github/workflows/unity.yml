name: Unity (trusted manual runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editmode:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: EditMode tests with locally licensed Unity
        shell: powershell
        run: ./test.ps1 -Coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unity-results
          path: |
            Logs/editmode-results.xml
            Logs/unity-tests.log
            Logs/unity-coverage-*/
