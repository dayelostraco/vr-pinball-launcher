name: Unity (trusted manual runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editmode:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: EditMode tests with locally licensed Unity
        shell: powershell
        run: ./test.ps1 -Coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unity-results
          path: |
            Logs/editmode-results.xml
            Logs/unity-tests.log
            Logs/unity-coverage-*/
